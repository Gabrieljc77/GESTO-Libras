```html
<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorial — Jogo de Sinais</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .introducao {
            text-align: center;
        }

        .sinal {
            width: 65%;
            height: 150px;
            border: 1px solid black;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .resposta {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .resposta input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 20px;
        }

        .teclado {
            width: 100%;
            max-width: 650px;
            margin: auto;
            border: 1px solid black;
            padding: 10px;
        }

        .linha-teclado {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin: 5px 0;
        }

        .teclado button {
            min-width: 45px;
            height: 40px;
            cursor: pointer;
        }

        .acoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
        }

        .acoes button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #resultado {
            text-align: center;
        }

        @media (max-width: 600px) {

            main {
                padding: 10px;
            }

            .sinal {
                width: 90%;
                height: 130px;
            }

            .teclado {
                width: 100%;
            }

            .teclado button {
                min-width: 35px;
                height: 35px;
            }

            .acoes {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>Tela 3 — Tutorial</h1>

    </header>


    <main>

        <section class="introducao">

            <h1>Tutorial</h1>

            <p>
                Observe o sinal e digite a resposta.
            </p>

        </section>


        <section>

            <div class="sinal">

                <!-- Espaço reservado para a imagem do sinal -->

            </div>

        </section>


        <section>

            <form action="#resultado" method="get">

                <div class="resposta">

                    <input type="text" name="letra1" maxlength="1">
                    <input type="text" name="letra2" maxlength="1">
                    <input type="text" name="letra3" maxlength="1">
                    <input type="text" name="letra4" maxlength="1">
                    <input type="text" name="letra5" maxlength="1">

                </div>


                <div class="teclado">

                    <div class="linha-teclado">

                        <button type="button">Q</button>
                        <button type="button">W</button>
                        <button type="button">E</button>
                        <button type="button">R</button>
                        <button type="button">T</button>
                        <button type="button">Y</button>
                        <button type="button">U</button>
                        <button type="button">I</button>
                        <button type="button">O</button>
                        <button type="button">P</button>

                    </div>


                    <div class="linha-teclado">

                        <button type="button">A</button>
                        <button type="button">S</button>
                        <button type="button">D</button>
                        <button type="button">F</button>
                        <button type="button">G</button>
                        <button type="button">H</button>
                        <button type="button">J</button>
                        <button type="button">K</button>
                        <button type="button">L</button>
                        <button type="button">Ç</button>

                    </div>


                    <div class="linha-teclado">

                        <button type="button">⇧</button>
                        <button type="button">Z</button>
                        <button type="button">X</button>
                        <button type="button">C</button>
                        <button type="button">V</button>
                        <button type="button">B</button>
                        <button type="button">N</button>
                        <button type="button">M</button>
                        <button type="reset">⌫</button>

                    </div>

                </div>


                <div class="acoes">

                    <details>

                        <summary>Dica</summary>

                        <p>
                            A resposta possui 5 letras.
                        </p>

                    </details>


                    <button type="submit">
                        Verificar
                    </button>

                </div>

            </form>

        </section>


        <hr>


        <section id="resultado">

            <p>

                <strong>Este é o modo de aprendizado.</strong>

                Observe o sinal e descubra a palavra correspondente digitando.

            </p>

        </section>

    </main>

</body>

</html>
