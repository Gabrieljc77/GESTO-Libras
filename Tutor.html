<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="author"
    content="Pedro Schumacker, Gabriel Jardim, Rafael Jardim e Guilherme Tavora">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GESTO — Tutorial</title>

<link rel="stylesheet" href="Tutor.css">


</head>

<body>


<main class="container">

    <header class="topo">

        <p>GESTO</p>

    </header>

    <article>

        <header class="titulo">

            <h1>TUTORIAL</h1>

            <p>
                Aprenda como jogar
            </p>

            <p class="descricao">
                Observe o sinal em Libras e digite a palavra correspondente.
            </p>

        </header>

        <figure class="sinal">

            <figcaption>
                Imagem do sinal em Libras
            </figcaption>

        </figure>

        <form action="#resultado" method="get" autocomplete="off">

            <fieldset class="resposta">

                <legend class="sr-only">
                    Digite a palavra correspondente ao sinal
                </legend>

                <input
                    type="text"
                    name="letra1"
                    maxlength="1"
                    aria-label="Primeira letra"
                >

                <input
                    type="text"
                    name="letra2"
                    maxlength="1"
                    aria-label="Segunda letra"
                >

                <input
                    type="text"
                    name="letra3"
                    maxlength="1"
                    aria-label="Terceira letra"
                >

                <input
                    type="text"
                    name="letra4"
                    maxlength="1"
                    aria-label="Quarta letra"
                >

                <input
                    type="text"
                    name="letra5"
                    maxlength="1"
                    aria-label="Quinta letra"
                >

            </fieldset>

            <nav class="teclado" aria-label="Teclado de letras">

                <section class="linha-teclado">

                    <button type="button">Q</button>
                    <button type="button">W</button>
                    <button type="button">E</button>
                    <button type="button">R</button>
                    <button type="button">T</button>
                    <button type="button">Y</button>
                    <button type="button">U</button>
                    <button type="button">I</button>
                    <button type="button">O</button>
                    <button type="button">P</button>

                </section>

                <section class="linha-teclado">

                    <button type="button">A</button>
                    <button type="button">S</button>
                    <button type="button">D</button>
                    <button type="button">F</button>
                    <button type="button">G</button>
                    <button type="button">H</button>
                    <button type="button">J</button>
                    <button type="button">K</button>
                    <button type="button">L</button>
                    <button type="button">Ç</button>

                </section>

                <section class="linha-teclado">

                    <button
                        type="button"
                        aria-label="Maiúsculas"
                    >
                        ⇧
                    </button>

                    <button type="button">Z</button>
                    <button type="button">X</button>
                    <button type="button">C</button>
                    <button type="button">V</button>
                    <button type="button">B</button>
                    <button type="button">N</button>
                    <button type="button">M</button>

                    <button
                        type="reset"
                        aria-label="Apagar resposta"
                    >
                        ⌫
                    </button>

                </section>

            </nav>

            <section class="acoes">

                <details>

                    <summary>Dica</summary>

                    <p>
                        A resposta possui 5 letras.
                    </p>

                </details>

                <button
                    class="verificar"
                    type="submit"
                >
                    Verificar
                </button>

            </section>

        </form>

    </article>

    <hr class="linha">

    <footer id="resultado">

        <p>

            <strong>Este é o modo de aprendizado.</strong>

            Observe o sinal e descubra a palavra correspondente digitando.

        </p>

    </footer>

</main>
```

</body>

</html>
