<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="author"
    content="Pedro Schumacker, Gabriel Jardim, Rafael Jardim e Guilherme Tavora">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GESTO — Tutorial</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        font-family: "Trebuchet MS", Arial, sans-serif;

        background-color: #11131a;
        color: #f5f5f5;

        padding: 30px;

        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* CONTAINER PRINCIPAL */

    .container {
        width: 100%;
        max-width: 1050px;

        margin: 0 auto;

        background-color: #1b1e29;

        border: 2px solid #35394a;
        border-radius: 12px;

        padding: 10px 20px 25px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.40);
    }

    /* TOPO */

    .topo {
        border-bottom: 2px solid #35394a;

        padding-bottom: 8px;
        margin-bottom: 20px;
    }

    .topo p {
        font-size: 16px;
        font-weight: bold;

        color: #8be9d0;

        letter-spacing: 2px;
    }

    /* TÍTULO */

    .titulo {
        text-align: center;
    }

    .titulo h1 {
        font-size: 42px;

        margin-bottom: 6px;

        color: #f5f3ff;

        letter-spacing: 5px;
        font-weight: 900;
    }

    .titulo p {
        font-size: 18px;
        font-weight: bold;

        color: #9b8cff;

        margin-bottom: 8px;
    }

    .descricao {
        font-size: 14px;

        color: #b8bdca;

        margin-bottom: 25px;
    }

    /* ÁREA DO SINAL */

    .sinal {
        width: 65%;
        height: 250px;

        margin: 0 auto 25px;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #222631;

        border: 2px solid #44495c;
        border-radius: 10px;

        color: #8f80ff;
        font-size: 15px;

        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.25);
    }

    /* RESPOSTA */

    .resposta {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 8px;

        margin-bottom: 20px;

        border: none;
        padding: 0;
    }

    .resposta input {
        width: 45px;
        height: 45px;

        background-color: #282c3a;

        color: #ffffff;

        border: 2px solid #44495c;
        border-radius: 7px;

        text-align: center;

        font-size: 20px;
        font-weight: bold;

        outline: none;
    }

    .resposta input:focus {
        border-color: #6957d9;

        box-shadow: 0 0 8px rgba(105, 87, 217, 0.4);
    }

    /* TECLADO */

    .teclado {
        width: 100%;
        max-width: 700px;

        margin: 0 auto;

        padding: 15px;

        background-color: #222631;

        border: 1px solid #414758;
        border-radius: 10px;
    }

    .linha-teclado {
        display: flex;

        justify-content: center;

        flex-wrap: wrap;

        gap: 6px;

        margin: 6px 0;
    }

    .teclado button {
        min-width: 48px;
        height: 42px;

        background-color: #282c3a;

        color: #ffffff;

        border: 2px solid #44495c;
        border-radius: 6px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .teclado button:hover {
        background-color: #6957d9;

        border-color: #8f80ff;

        transform: translateY(-2px);
    }

    .teclado button:active {
        transform: translateY(0);
    }

    /* BOTÃO APAGAR */

    .teclado button[type="reset"] {
        border-color: #398c85;
    }

    .teclado button[type="reset"]:hover {
        background-color: #398c85;

        border-color: #65d4c8;
    }

    /* AÇÕES */

    .acoes {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 25px;

        margin-top: 25px;
    }

    /* DICA */

    details {
        background-color: #282c3a;

        border: 2px solid #398c85;
        border-radius: 7px;

        padding: 8px 15px;

        color: #ffffff;
    }

    summary {
        color: #65d4c8;

        font-weight: bold;

        cursor: pointer;
    }

    details p {
        margin-top: 8px;

        color: #b8bdca;

        font-size: 13px;
    }

    /* VERIFICAR */

    .verificar {
        padding: 11px 25px;

        background-color: #6957d9;

        color: #ffffff;

        border: 2px solid #8f80ff;
        border-radius: 7px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .verificar:hover {
        background-color: #7b69eb;

        transform: translateY(-2px);
    }

    .verificar:active {
        transform: translateY(0);
    }

    /* LINHA */

    .linha {
        border: none;

        border-top: 2px dotted #4a5061;

        width: 80%;

        margin: 30px auto 20px;
    }

    /* RESULTADO */

    #resultado {
        text-align: center;
    }

    #resultado p {
        font-size: 14px;

        color: #b8bdca;

        line-height: 1.6;
    }

    #resultado strong {
        color: #8be9d0;
    }

    /* ACESSIBILIDADE */

    .sr-only {
        position: absolute;

        width: 1px;
        height: 1px;

        padding: 0;
        margin: -1px;

        overflow: hidden;

        clip: rect(0, 0, 0, 0);

        white-space: nowrap;

        border: 0;
    }

    /* RESPONSIVIDADE */

    @media (max-width: 600px) {

        body {
            padding: 15px;
        }

        .container {
            padding: 10px 15px 20px;
        }

        .titulo h1 {
            font-size: 34px;

            letter-spacing: 3px;
        }

        .titulo p {
            font-size: 16px;
        }

        .descricao {
            font-size: 13px;
        }

        .sinal {
            width: 95%;
            height: 200px;
        }

        .resposta input {
            width: 40px;
            height: 40px;
        }

        .teclado {
            padding: 10px 5px;
        }

        .teclado button {
            min-width: 36px;
            height: 36px;

            font-size: 13px;
        }

        .acoes {
            flex-direction: column;

            gap: 15px;
        }

        .linha {
            width: 95%;
        }

    }

</style>


</head>

<body>


<main class="container">

    <header class="topo">

        <p>GESTO</p>

    </header>

    <article>

        <header class="titulo">

            <h1>TUTORIAL</h1>

            <p>
                Aprenda como jogar
            </p>

            <p class="descricao">
                Observe o sinal em Libras e digite a palavra correspondente.
            </p>

        </header>

        <figure class="sinal">

            <figcaption>
                Imagem do sinal em Libras
            </figcaption>

        </figure>

        <form action="#resultado" method="get" autocomplete="off">

            <fieldset class="resposta">

                <legend class="sr-only">
                    Digite a palavra correspondente ao sinal
                </legend>

                <input
                    type="text"
                    name="letra1"
                    maxlength="1"
                    aria-label="Primeira letra"
                >

                <input
                    type="text"
                    name="letra2"
                    maxlength="1"
                    aria-label="Segunda letra"
                >

                <input
                    type="text"
                    name="letra3"
                    maxlength="1"
                    aria-label="Terceira letra"
                >

                <input
                    type="text"
                    name="letra4"
                    maxlength="1"
                    aria-label="Quarta letra"
                >

                <input
                    type="text"
                    name="letra5"
                    maxlength="1"
                    aria-label="Quinta letra"
                >

            </fieldset>

            <nav class="teclado" aria-label="Teclado de letras">

                <section class="linha-teclado">

                    <button type="button">Q</button>
                    <button type="button">W</button>
                    <button type="button">E</button>
                    <button type="button">R</button>
                    <button type="button">T</button>
                    <button type="button">Y</button>
                    <button type="button">U</button>
                    <button type="button">I</button>
                    <button type="button">O</button>
                    <button type="button">P</button>

                </section>

                <section class="linha-teclado">

                    <button type="button">A</button>
                    <button type="button">S</button>
                    <button type="button">D</button>
                    <button type="button">F</button>
                    <button type="button">G</button>
                    <button type="button">H</button>
                    <button type="button">J</button>
                    <button type="button">K</button>
                    <button type="button">L</button>
                    <button type="button">Ç</button>

                </section>

                <section class="linha-teclado">

                    <button
                        type="button"
                        aria-label="Maiúsculas"
                    >
                        ⇧
                    </button>

                    <button type="button">Z</button>
                    <button type="button">X</button>
                    <button type="button">C</button>
                    <button type="button">V</button>
                    <button type="button">B</button>
                    <button type="button">N</button>
                    <button type="button">M</button>

                    <button
                        type="reset"
                        aria-label="Apagar resposta"
                    >
                        ⌫
                    </button>

                </section>

            </nav>

            <section class="acoes">

                <details>

                    <summary>Dica</summary>

                    <p>
                        A resposta possui 5 letras.
                    </p>

                </details>

                <button
                    class="verificar"
                    type="submit"
                >
                    Verificar
                </button>

            </section>

        </form>

    </article>

    <hr class="linha">

    <footer id="resultado">

        <p>

            <strong>Este é o modo de aprendizado.</strong>

            Observe o sinal e descubra a palavra correspondente digitando.

        </p>

    </footer>

</main>

</html>
