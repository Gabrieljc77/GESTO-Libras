<body>

    <main class="container">

        <header class="topo">
            <p>GESTO</p>
        </header>

        <article>

            <header class="titulo">

                <h1>TUTORIAL</h1>

                <p>Aprenda como jogar</p>

                <p class="descricao">
                    Observe o sinal em Libras e digite a palavra correspondente.
                </p>

            </header>

            <figure class="sinal">
                <figcaption>
                    Imagem do sinal em Libras
                </figcaption>
            </figure>

            <form action="#resultado" method="get" autocomplete="off">

                <fieldset class="resposta">

                    <legend class="sr-only">
                        Digite a palavra correspondente ao sinal
                    </legend>

                    <input type="text" name="letra1" maxlength="1"
                        aria-label="Primeira letra">

                    <input type="text" name="letra2" maxlength="1"
                        aria-label="Segunda letra">

                    <input type="text" name="letra3" maxlength="1"
                        aria-label="Terceira letra">

                    <input type="text" name="letra4" maxlength="1"
                        aria-label="Quarta letra">

                    <input type="text" name="letra5" maxlength="1"
                        aria-label="Quinta letra">

                </fieldset>

                <nav class="teclado" aria-label="Teclado de letras">

                    <div class="linha-teclado">
                        ...
                    </div>

                    <div class="linha-teclado">
                        ...
                    </div>

                    <div class="linha-teclado">
                        ...
                    </div>

                </nav>

                <section class="acoes">

                    <details>
                        <summary>Dica</summary>

                        <p>
                            A resposta possui 5 letras.
                        </p>
                    </details>

                    <button class="verificar" type="submit">
                        Verificar
                    </button>

                </section>

            </form>

        </article>

        <hr class="linha">

        <footer id="resultado">

            <p>
                <strong>Este é o modo de aprendizado.</strong>
                Observe o sinal e descubra a palavra correspondente digitando.
            </p>

        </footer>

    </main>

</body>
